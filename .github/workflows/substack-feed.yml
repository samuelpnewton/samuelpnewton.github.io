name: Build Substack Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse Substack RSS feed
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request
          import xml.etree.ElementTree as ET

          FEED_URL = "https://bodhibearriver.substack.com/feed"
          OUT_PATH = "data/substack-posts.json"
          MAX_ITEMS = 6

          req = urllib.request.Request(
              FEED_URL,
              headers={"User-Agent": "Mozilla/5.0 (compatible; SamNewtonSiteBot/1.0)"}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = resp.read()
                  ctype = resp.headers.get("Content-Type", "")
          except Exception as e:
              print("Fetch failed:", e)
              raise SystemExit(0)

          if "xml" not in ctype and b"<rss" not in body[:200]:
              print("Response doesn't look like RSS (no posts published yet?) - leaving existing file untouched.")
              raise SystemExit(0)

          try:
              root = ET.fromstring(body)
          except ET.ParseError as e:
              print("XML parse failed:", e)
              raise SystemExit(0)

          items = []
          for item in root.findall("./channel/item")[:MAX_ITEMS]:
              def text(tag):
                  el = item.find(tag)
                  return el.text.strip() if el is not None and el.text else ""

              summary = text("description")
              summary = re.sub(r"<[^>]+>", "", summary).strip()
              if len(summary) > 220:
                  summary = summary[:220].rsplit(" ", 1)[0] + "…"

              items.append({
                  "title": text("title"),
                  "link": text("link"),
                  "date": text("pubDate"),
                  "summary": summary,
              })

          if not items:
              print("No items found - leaving existing file untouched.")
              raise SystemExit(0)

          os.makedirs("data", exist_ok=True)
          with open(OUT_PATH, "w") as fh:
              json.dump(items, fh, indent=2)
              fh.write("\n")
          print(f"Wrote {len(items)} items to {OUT_PATH}")
          EOF

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/substack-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Substack feed"
            git push
          else
            echo "No changes to Substack feed."
          fi
