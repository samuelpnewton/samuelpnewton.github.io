name: Build Substack Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse Substack RSS feed
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request, urllib.parse

          # Substack blocks direct requests from GitHub Actions' IP ranges (403),
          # so fetch through a relay that does the request from its own servers.
          FEED_URL = "https://bodhibearriver.substack.com/feed"
          RELAY_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + urllib.parse.quote(FEED_URL, safe="")
          OUT_PATH = "data/substack-posts.json"
          MAX_ITEMS = 6

          req = urllib.request.Request(
              RELAY_URL,
              headers={"User-Agent": "Mozilla/5.0 (compatible; SamNewtonSiteBot/1.0)"}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read())
          except Exception as e:
              print("Fetch failed:", e)
              raise SystemExit(0)

          if data.get("status") != "ok":
              print("Relay did not return ok status:", data.get("status"), data.get("message"))
              raise SystemExit(0)

          items = []
          for it in data.get("items", [])[:MAX_ITEMS]:
              summary = re.sub(r"<[^>]+>", "", it.get("description") or "").strip()
              if len(summary) > 220:
                  summary = summary[:220].rsplit(" ", 1)[0] + "…"

              items.append({
                  "title": it.get("title", ""),
                  "link": it.get("link", ""),
                  "date": (it.get("pubDate") or "").replace(" ", "T"),
                  "summary": summary,
              })

          if not items:
              print("No items found - leaving existing file untouched.")
              raise SystemExit(0)

          os.makedirs("data", exist_ok=True)
          with open(OUT_PATH, "w") as fh:
              json.dump(items, fh, indent=2)
              fh.write("\n")
          print(f"Wrote {len(items)} items to {OUT_PATH}")
          EOF

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/substack-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Substack feed"
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (another commit landed first) - retrying with rebase ($i)..."
              git fetch origin
              git rebase origin/main
            done
            echo "Push still failing after retries."
            exit 1
          else
            echo "No changes to Substack feed."
          fi
