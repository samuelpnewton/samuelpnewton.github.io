name: Build Substack Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse Substack RSS feed
        run: |
          python3 - <<'EOF'
          import html, json, os, re, urllib.request, urllib.parse

          FEED_URL = "https://bodhibearriver.substack.com/feed"
          OUT_PATH = "data/substack-posts.json"
          MAX_ITEMS = 6
          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; SamNewtonSiteBot/1.0)"}

          def strip_html(raw):
              # page renders these via textContent, so any leftover entities (e.g. &#8220;)
              # would show up literally instead of as a curly quote - unescape them here.
              text = html.unescape(re.sub(r"<[^>]+>", "", raw or "")).strip()
              if len(text) > 220:
                  text = text[:220].rsplit(" ", 1)[0] + "…"
              return text

          def fetch_json(url, timeout=20):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read())

          def from_direct_rss():
              # Substack has blocked direct requests from GitHub Actions' IP ranges before;
              # try it first anyway since that block isn't permanent, and it needs no relay.
              req = urllib.request.Request(FEED_URL, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  xml = resp.read().decode("utf-8", "replace")
              items = []
              for block in re.findall(r"<item>(.*?)</item>", xml, re.S)[:MAX_ITEMS]:
                  def tag(name):
                      m = re.search(rf"<{name}>(?:<!\[CDATA\[(.*?)\]\]>|(.*?))</{name}>", block, re.S)
                      return (m.group(1) or m.group(2) or "").strip() if m else ""
                  items.append({
                      "title": tag("title"),
                      "link": tag("link"),
                      "date": tag("pubDate"),
                      "summary": strip_html(tag("description")),
                  })
              return items

          def from_feed2json():
              # feed2json.org proxies the request without caching the result, unlike
              # rss2json.com, which can serve a stale snapshot for hours after a new post
              # goes up. Used as a fallback if Substack is still blocking Actions IPs.
              url = "https://feed2json.org/convert?url=" + urllib.parse.quote(FEED_URL, safe="")
              data = fetch_json(url)
              items = []
              for it in data.get("items", [])[:MAX_ITEMS]:
                  items.append({
                      "title": it.get("title", ""),
                      "link": it.get("url", ""),
                      "date": it.get("date_published", ""),
                      "summary": strip_html(it.get("summary", "")),
                  })
              return items

          items = []
          for fetcher in (from_direct_rss, from_feed2json):
              try:
                  items = fetcher()
                  if items:
                      print(f"Fetched {len(items)} items via {fetcher.__name__}")
                      break
              except Exception as e:
                  print(f"{fetcher.__name__} failed:", e)

          if not items:
              print("No items found from any source - leaving existing file untouched.")
              raise SystemExit(0)

          os.makedirs("data", exist_ok=True)
          with open(OUT_PATH, "w") as fh:
              json.dump(items, fh, indent=2)
              fh.write("\n")
          print(f"Wrote {len(items)} items to {OUT_PATH}")
          EOF

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/substack-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Substack feed"
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (another commit landed first) - retrying with rebase ($i)..."
              git fetch origin
              git rebase origin/main
            done
            echo "Push still failing after retries."
            exit 1
          else
            echo "No changes to Substack feed."
          fi
