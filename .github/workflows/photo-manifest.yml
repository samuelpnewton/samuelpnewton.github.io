name: Build Photography Manifest

on:
  push:
    branches: [main]
    paths:
      - 'images/photography/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 - <<'EOF'
          import json, os, re, struct

          folder = "images/photography"
          exts = (".jpg", ".jpeg", ".png", ".webp", ".gif")
          skip = {"manifest.json", "placeholder.svg"}

          SMALL_WORDS = {"a", "an", "the", "of", "in", "on", "at", "to", "up",
                         "and", "or", "for", "with", "from", "into", "near", "above", "below"}

          def to_alt(filename):
              name = os.path.splitext(filename)[0]
              words = re.sub(r'[-_]+', ' ', name).strip().split(' ')
              if not words or not words[0]:
                  return "Photograph"
              out = []
              for i, w in enumerate(words):
                  if i > 0 and w.lower() in SMALL_WORDS:
                      out.append(w.lower())
                  else:
                      out.append(w[:1].upper() + w[1:] if w else w)
              return ' '.join(out)

          def get_size(path):
              """Return (width, height) for JPEG/PNG/GIF, or None if undetermined."""
              try:
                  with open(path, "rb") as f:
                      head = f.read(32)
                      if head[:8] == b'\x89PNG\r\n\x1a\n':
                          w, h = struct.unpack('>II', head[16:24])
                          return w, h
                      if head[:6] in (b'GIF87a', b'GIF89a'):
                          w, h = struct.unpack('<HH', head[6:10])
                          return w, h
                      if head[:2] == b'\xff\xd8':
                          f.seek(2)
                          while True:
                              marker = f.read(2)
                              if len(marker) < 2 or marker[0] != 0xFF:
                                  break
                              if marker[1] in (0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7,
                                                0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF):
                                  f.read(3)
                                  h, w = struct.unpack('>HH', f.read(4))
                                  return w, h
                              elif marker[1] in (0xD8, 0xD9):
                                  continue
                              else:
                                  seg_len = struct.unpack('>H', f.read(2))[0]
                                  f.seek(seg_len - 2, 1)
              except Exception as e:
                  print("size read failed for", path, e)
              return None

          files = sorted(
              f for f in os.listdir(folder)
              if f.lower().endswith(exts) and f not in skip
          )

          # caption is always derived from the filename - rename the file to caption it
          manifest_path = os.path.join(folder, "manifest.json")

          manifest = []
          for f in files:
              size = get_size(os.path.join(folder, f))
              entry = {
                  "file": f,
                  "alt": to_alt(f),
              }
              if size:
                  entry["w"], entry["h"] = size
              manifest.append(entry)

          with open(manifest_path, "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          EOF

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/photography/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update photography manifest"
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (another commit landed first) - retrying with rebase ($i)..."
              git fetch origin
              git rebase origin/main
            done
            echo "Push still failing after retries."
            exit 1
          else
            echo "No changes to manifest."
          fi
