name: Build Photography Manifest

on:
  push:
    branches: [main]
    paths:
      - 'images/photography/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 - <<'EOF'
          import json, os, re

          folder = "images/photography"
          exts = (".jpg", ".jpeg", ".png", ".webp", ".gif")
          skip = {"manifest.json", "placeholder.svg"}

          files = sorted(
              f for f in os.listdir(folder)
              if f.lower().endswith(exts) and f not in skip
          )

          def to_alt(filename):
              name = os.path.splitext(filename)[0]
              name = re.sub(r'[-_]+', ' ', name).strip()
              return name.title() if name else "Photograph"

          manifest = [{"file": f, "alt": to_alt(f)} for f in files]

          with open(os.path.join(folder, "manifest.json"), "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          EOF

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/photography/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update photography manifest"
            git push
          else
            echo "No changes to manifest."
          fi
